<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Player Setup Screen -->
  <div id="start-screen" class="screen">
    <h1>Enter Player Names</h1>
    <input type="text" id="player1" placeholder="Player 1 Name" />
    <input type="text" id="player2" placeholder="Player 2 Name" />
    <button onclick="startGame()">Start Game</button>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen hidden">
    <h1>Rock, Paper, Scissors</h1>
    <div class="choices">
      <div>
        <h3 id="user-name">Player 1</h3>
        <div class="choice" id="user-choice">❔</div>
      </div>
      <div class="vs">VS</div>
      <div>
        <h3 id="bot-name">Player 2</h3>
        <div class="choice" id="bot-choice">❔</div>
      </div>
    </div>

    <div class="buttons">
      <button onclick="play('Rock')">🪨 Rock</button>
      <button onclick="play('Paper')">📄 Paper</button>
      <button onclick="play('Scissors')">✂️ Scissors</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen hidden">
    <h1 id="result-title">Result</h1>
    <p id="result-detail">Player X wins!</p>
  </div>

  <!-- Menu Screen -->
  <div id="menu-screen" class="screen hidden">
    <h2>What would you like to do?</h2>
    <button onclick="continueGame()">Play Again</button>
    <button onclick="resetGame()">Change Names</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
